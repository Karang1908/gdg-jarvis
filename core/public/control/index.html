<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000308" />
    <title>JARVIS — Control</title>

    <!--
      SPEC.md §19 and §39. This page is the guaranteed path: it works with no LLM, no
      internet, and — apart from the microphone — no cloud service of any kind. The first
      cinematic moment of the demo is triggered from here rather than from anything that
      could fail to understand a sentence.

      Built for a phone held in one hand, in a dark room, by someone who is also talking.
    -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%23000308"/><circle cx="16" cy="16" r="10" fill="none" stroke="%234fd8ff" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="%234fd8ff"/></svg>' />

    <link rel="stylesheet" href="/shared/jarvis.css" />
    <link rel="stylesheet" href="/control/control.css" />
  </head>

  <body class="control-body">
    <div class="atmosphere"></div>

    <!-- Sign-in -->
    <div class="gate" id="gate">
      <form class="gate-form panel" id="gate-form">
        <div class="label">JARVIS CORE</div>
        <div class="gate-title wordmark">J.A.R.V.I.S.</div>
        <label class="gate-label" for="gate-token">ADMIN TOKEN</label>
        <input
          class="gate-input"
          id="gate-token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          inputmode="text"
        />
        <button class="gate-button" type="submit">AUTHENTICATE</button>
        <div class="gate-error" id="gate-error" hidden></div>
      </form>
    </div>

    <main class="console" id="console" hidden>
      <header class="console-head">
        <span class="label">J.A.R.V.I.S. CONTROL</span>
        <span class="console-link">
          <span class="dot" id="link-dot"></span>
          <span class="label" id="link-text">CONNECTING</span>
        </span>
      </header>

      <!--
        Voice.

        The mic is yours to open and close. Closed by default and closed the moment you tap
        it again, because a presenter is talking to an audience for most of the demo and
        nothing they say to the room should be interpreted as a command.

        Recognition happens in this browser and is matched against a fixed set of phrases
        locally — no model, no server round trip, no LLM in the path. That means it keeps
        working when the AI layer does not.
      -->
      <section class="voice" id="voice" hidden>
        <button class="mic" id="mic" type="button" aria-pressed="false">
          <span class="mic-icon" id="mic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="9" y="2.5" width="6" height="11" rx="3" />
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
              <path d="M12 17.5V21" />
              <line class="mic-slash" x1="3.5" y1="3.5" x2="20.5" y2="20.5" />
            </svg>
          </span>
          <span class="mic-label" id="mic-label">MIC OFF</span>
        </button>
        <div class="voice-heard" id="voice-heard"></div>
      </section>

      <!-- Live room. Tap a device to target it. -->
      <section class="nodes" id="nodes"></section>

      <section class="target-row">
        <span class="label">TARGET</span>
        <strong class="target-value" id="target-value">ALL</strong>
        <button class="speaker" id="speaker" type="button" aria-pressed="false">
          <span id="speaker-label">JARVIS AUDIBLE</span>
        </button>
      </section>

      <section class="actions">
        <button class="btn btn-primary" data-act="takeover">TAKE THE ROOM</button>
        <button class="btn" data-act="identify">IDENTIFY</button>
        <button class="btn" data-act="split">SPLIT JARVIS</button>
        <button class="btn" data-act="cascade">REACTOR CASCADE</button>
      </section>

      <section class="group">
        <div class="label">SCENES</div>
        <div class="chips" id="scene-chips"></div>
      </section>

      <section class="group">
        <div class="label">MOVE JARVIS TO</div>
        <div class="chips" id="move-chips"></div>
      </section>

      <section class="group">
        <div class="label">OPEN APPLICATION</div>
        <div class="chips" id="app-chips"></div>
      </section>

      <section class="group">
        <div class="label">OPEN URL</div>
        <form class="inline-form" id="url-form">
          <input
            class="text-input"
            id="url-input"
            type="url"
            placeholder="https://gdg.community.dev/"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="btn btn-small" type="submit">OPEN</button>
        </form>
      </section>

      <!--
        Scripted speech.

        Every line the demo needs is a button. If the voice layer fails, mishears, or the
        venue is too loud, the presenter taps instead of asking and the room never learns
        the difference. SPEC.md §39 applied to speech.
      -->
      <section class="group">
        <div class="label">JARVIS SAYS</div>
        <div class="chips" id="phrase-chips"></div>
        <form class="inline-form" id="speak-form">
          <input class="text-input" id="speak-input" placeholder="say something" autocomplete="off" />
          <button class="btn btn-small" type="submit">SPEAK</button>
        </form>
      </section>

      <div class="feedback" id="feedback"></div>
    </main>

    <!--
      SPEC.md §33. Fixed to the bottom of the viewport, present at every scroll position,
      never disabled, and the only red control on the page. If exactly one thing here
      works, it has to be this one.
    -->
    <button class="release-all" id="release-all" hidden>RELEASE ALL</button>

    <script src="/shared/stream.js"></script>
    <script src="/shared/session.js"></script>
    <script src="/control/voice.js"></script>
    <script src="/control/control.js"></script>
  </body>
</html>
